<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bobcat Language School — Pronomes Objeto e Possessivos (Canvas)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-kit.css">
<link rel="stylesheet" href="gridscape-kit.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="../db-client.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
</head><body>
<div class="hud" id="hud" style="top:0;left:0;right:0;">
  <div class="hud-left"><span>🐾 Bobcat</span>
    <div class="xp-track"><div class="xp-fill" id="xpBar"></div></div>
    <span id="xpLabel" style="font-weight:700;color:var(--orange-dark)">0 XP</span>
  </div>
  <div class="hud-right">
    <span class="pill" id="levelPill">⭐ Nível 1</span>
    <span class="pill" id="starsPill">🏆 0 estrelas</span>
  </div>
</div>
<a class="gback" href="../index.html">← Voltar ao app</a>
<span class="glabel">EXTRA · MAPA · PRONOMES</span>
<div id="canvasWrap"><div id="canvas">
<svg class="gline" id="lines" width="1200" height="12000">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd166"/><stop offset="100%" stop-color="#ff8a4c"/>
    </linearGradient>
    <filter id="lineGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
</div></div>
<div class="gcapacity" id="capacityBadge">CAPACIDADE: 1/8 NÓS</div>
<div class="gtoolbar"><button type="button" id="recenter" aria-label="Recentrar">⤾</button></div>
<script src="lesson-kit.js"></script>
<script src="gridscape-kit.js"></script>
<script>
const LESSON_ID = "extra-gridscape-pronouns";
const TOTAL_Q = 29;
var SCORE = { correct: 0, total: TOTAL_Q };
var qCorrect = 0, fillCorrect = 0;
var norm = Gridscape.norm, addXP = Gridscape.addXP;
var QUIZ = [{"prompt": "Give ___ the book.", "options": ["me", "I", "my"], "answer": 0}, {"prompt": "This pen is ___.", "options": ["mine", "my", "me"], "answer": 0}, {"prompt": "I saw ___.", "options": ["her", "she", "hers"], "answer": 0}, {"prompt": "The house is ___.", "options": ["theirs", "their", "them"], "answer": 0}, {"prompt": "Come with ___.", "options": ["us", "we", "our"], "answer": 0}, {"prompt": "Is this ___?", "options": ["yours", "your", "you"], "answer": 0}, {"prompt": "Tell ___ the truth.", "options": ["them", "they", "their"], "answer": 0}, {"prompt": "That car is ___.", "options": ["his", "him", "he"], "answer": 0}];
var FILL = [{"s": "Help ___. (eu)", "a": "me"}, {"s": "This is ___. (meu)", "a": "mine"}, {"s": "I called ___. (ela)", "a": "her"}, {"s": "The books are ___. (deles)", "a": "theirs"}, {"s": "Sit with ___. (nós)", "a": "us"}];
var NODES = ["<div class=\"gtag\"><span><span class=\"gnum\">1</span> INTRO</span><span>OBJETIVOS</span></div><h2 class=\"gtitle\">Pronomes Objeto e Possessivos</h2><p class=\"gsub\">me, him, her, us… e mine, yours…</p><div class=\"gcard\">🎯 Estude a estrutura, ouça os exemplos e complete os exercícios no mapa.</div><div class=\"gcard\">Diálogo<br><span style=\"display:block;margin-top:6px\"><b>Tom:</b> Can you help me? <button class=\"gaudio\" data-speak=\"Can you help me?\" data-gender=\"male\">🔊</button></span><span style=\"display:block;margin-top:6px\"><b>Anna:</b> OK. I will call her now. <button class=\"gaudio\" data-speak=\"OK. I will call her now.\" data-gender=\"female\">🔊</button></span></div><button type=\"button\" class=\"gnext\" data-go>Continuar →</button>", "<div class=\"gtag\"><span><span class=\"gnum\">2</span> GRAMÁTICA</span><span>PRONOMES</span></div><h2 class=\"gtitle\">Estrutura</h2><div class=\"gcard\"><b>Objeto</b> — me, him, her, us, them</div><div class=\"gcard\"><b>Possessivos</b> — mine, yours, his, hers</div><div class=\"gcard\"><b>Trocar</b> — Suj. → obj. → poss.</div><button type=\"button\" class=\"gnext\" data-go>Ver vocabulário →</button>", "<div class=\"gtag\"><span><span class=\"gnum\">3</span> VOCABULÁRIO</span><span>ÁUDIO</span></div><h2 class=\"gtitle\">Palavras-chave</h2><div class=\"gvocab\"><span><b>me / you</b> — me / te</span><button class=\"gaudio\" data-speak=\"me\">🔊</button></div><div class=\"gvocab\"><span><b>him / her</b> — o / a</span><button class=\"gaudio\" data-speak=\"him\">🔊</button></div><div class=\"gvocab\"><span><b>us / them</b> — nos / os</span><button class=\"gaudio\" data-speak=\"us\">🔊</button></div><div class=\"gvocab\"><span><b>mine / yours</b> — meu / seu</span><button class=\"gaudio\" data-speak=\"mine\">🔊</button></div><div class=\"gvocab\"><span><b>his / hers</b> — dele / dela</span><button class=\"gaudio\" data-speak=\"his\">🔊</button></div><div class=\"gvocab\"><span><b>ours / theirs</b> — nosso / deles</span><button class=\"gaudio\" data-speak=\"ours\">🔊</button></div><button type=\"button\" class=\"gnext\" data-go>Ouvir diálogo →</button>", "<div class=\"gtag\"><span><span class=\"gnum\">4</span> DIÁLOGO</span><span>LISTENING</span></div><h2 class=\"gtitle\">Listening &amp; Speaking</h2><p class=\"gsub\">Toque em 🔊 para ouvir. Vozes variam por personagem.</p><div class=\"gcard\"><span style=\"display:block;margin:6px 0\"><b>Tom:</b> Can you help me? <button class=\"gaudio\" data-speak=\"Can you help me?\" data-gender=\"male\">🔊</button></span><span style=\"display:block;margin:6px 0\"><b>Anna:</b> OK. I will call her now. <button class=\"gaudio\" data-speak=\"OK. I will call her now.\" data-gender=\"female\">🔊</button></span></div><button type=\"button\" class=\"gnext\" data-go>Próximo →</button>", "<div class=\"gtag\"><span><span class=\"gnum\">5</span> DICA</span><span>TIP</span></div><h2 class=\"gtitle\">Dica de estudo</h2><div class=\"gcard\">Ouça cada exemplo em voz alta, repita e depois faça o quiz sem olhar.</div><button type=\"button\" class=\"gnext\" data-go>Ir para o quiz →</button>", "<div class=\"gtag\"><span><span class=\"gnum\">6</span> QUIZ RELÂMPAGO</span><span class=\"gscore\" id=\"quizScore\">0/8</span></div><h2 class=\"gtitle\">Escolha a forma certa</h2><div id=\"quizGame\"></div><button type=\"button\" class=\"gnext\" id=\"btnQuizNext\">Próxima pergunta →</button><div id=\"quizDone\" style=\"display:none;margin-top:14px\"><button type=\"button\" class=\"gnext\" data-go>Completar frases →</button></div>", "<div class=\"gtag\"><span><span class=\"gnum\">7</span> COMPLETE AS LACUNAS</span><span class=\"gscore\" id=\"sFill\">0/5</span></div><h2 class=\"gtitle\">Escreva a resposta</h2><div id=\"fillBox\"></div><button type=\"button\" class=\"gnext\" onclick=\"checkFill()\">Verificar</button><div id=\"fillDone\" style=\"display:none;margin-top:14px\"><button type=\"button\" class=\"gnext\" data-go>Finalizar →</button></div>", "<div class=\"gtag\"><span><span class=\"gnum\">P1</span> VERDADEIRO / FALSO</span><span class=\"gscore\" id=\"tfScore\">0/3</span></div><h2 class=\"gtitle\">Leia e decida</h2><p class=\"gpractice-hint\">Exercício prático de compreensão.</p><div id=\"tfGame\"></div><div id=\"tfDone\" style=\"display:none;margin-top:12px\"><button type=\"button\" class=\"gnext\" data-go>Próximo exercício →</button></div>", "<div class=\"gtag\"><span><span class=\"gnum\">P2</span> COMBINAR</span><span class=\"gscore\" id=\"matchScore\">0/6</span></div><h2 class=\"gtitle\">Combine os pares</h2><div id=\"matchGame\"></div><div id=\"matchDone\" style=\"display:none;margin-top:12px\"><button type=\"button\" class=\"gnext\" data-go>Próximo exercício →</button></div>", "<div class=\"gtag\"><span><span class=\"gnum\">P3</span> ORDENAR DIÁLOGO</span><span class=\"gscore\" id=\"orderScore\">0/1</span></div><h2 class=\"gtitle\">Monte o diálogo</h2><div id=\"orderGame\"></div><div id=\"orderDone\" style=\"display:none;margin-top:12px\"><button type=\"button\" class=\"gnext\" data-go>Prática oral →</button></div>", "<div class=\"gtag\"><span><span class=\"gnum\">P4</span> PRÁTICA ORAL</span><span class=\"gscore\" id=\"speakScore\">0/5</span></div><h2 class=\"gtitle\">Fale em voz alta</h2><div id=\"speakGame\"></div><div id=\"speakDone\" style=\"display:none;margin-top:12px\"><button type=\"button\" class=\"gnext\" data-go>Montar frase →</button></div>", "<div class=\"gtag\"><span><span class=\"gnum\">P5</span> MONTAR FRASE</span><span class=\"gscore\" id=\"scrambleScore\">0/1</span></div><h2 class=\"gtitle\">Organize as palavras</h2><div id=\"scrambleGame\"></div><div id=\"scrambleDone\" style=\"display:none;margin-top:12px\"><button type=\"button\" class=\"gnext\" data-go>Finalizar →</button></div>", "<div class=\"gtag\"><span><span class=\"gnum\">8</span> REVISÃO FINAL</span><span>🏁</span></div><h2 class=\"gtitle\">Você concluiu o mapa!</h2><div class=\"gcard\">Pronomes Objeto e Possessivos — continue praticando no app e no chat com IA.</div><button type=\"button\" class=\"gnext\" id=\"btnFinish\">🏁 Finalizar Lição</button><p id=\"finishMsg\" style=\"display:none;margin-top:12px;font-weight:700;\"></p><div style=\"margin-top:14px\"><a href=\"../index.html\" style=\"font-weight:700;font-size:13px;color:#16130f\">← Voltar para Extra</a></div>"];

Gridscape.init({
  lessonId: LESSON_ID,
  totalQuestions: TOTAL_Q,
  nodes: NODES,
  onReady: function (api) {
    var qi = 0, qAnswered = false;
    function renderQuiz(){
      var box = document.getElementById('quizGame');
      if(!box) return;
      if(qi >= QUIZ.length){
        box.innerHTML = '<p style="font-weight:700;color:var(--ok,#1e6b40)">Quiz completo! '+qCorrect+'/'+QUIZ.length+' acertos.</p>';
        document.getElementById('btnQuizNext').style.display='none';
        document.getElementById('quizDone').style.display='block';
        api.remeasure(); return;
      }
      qAnswered = false;
      var q = QUIZ[qi];
      var opts = q.options.map(function(o,i){
        return '<button type="button" class="gq-opt" data-i="'+i+'">'+o+'</button>';
      }).join('');
      box.innerHTML = '<p style="font-weight:700;font-size:15px;margin:0 0 8px">'+(qi+1)+'. '+q.prompt+'</p><div>'+opts+'</div>';
      box.querySelectorAll('button[data-i]').forEach(function(b){
        b.addEventListener('click', function(){
          if(qAnswered) return; qAnswered = true;
          var ok = +b.dataset.i === q.answer;
          if(ok){ qCorrect++; addXP(15); b.classList.add('ok'); }
          else { b.classList.add('bad'); }
          document.getElementById('quizScore').textContent = qCorrect+'/'+QUIZ.length;
          SCORE.correct = qCorrect + fillCorrect;
        });
      });
      api.remeasure();
    }
    var btnQ = document.getElementById('btnQuizNext');
    if(btnQ) btnQ.addEventListener('click', function(){
      if(!qAnswered && qi < QUIZ.length) return;
      qi++; renderQuiz();
    });
    renderQuiz();

    (function(){
      var el = document.getElementById('fillBox');
      if(!el) return;
      FILL.forEach(function(item,i){
        var p = item.s.split('___');
        var row = document.createElement('div');
        row.className = 'gfill-row';
        row.innerHTML = '<span>'+p[0]+'</span><input class="gfill-input" id="gfill_'+i+'"><span>'+(p[1]||'')+'</span>';
        el.appendChild(row);
      });
    })();

    window.checkFill = function(){
      fillCorrect = 0;
      FILL.forEach(function(item,i){
        var inp = document.getElementById('gfill_'+i);
        var ok = norm(inp.value) === norm(item.a);
        inp.className = 'gfill-input '+(ok?'correct':'incorrect');
        if(ok) fillCorrect++;
      });
      document.getElementById('sFill').textContent = fillCorrect+'/'+FILL.length;
      addXP(fillCorrect*12);
      SCORE.correct = qCorrect + fillCorrect;
      document.getElementById('fillDone').style.display = 'block';
      if(SCORE.correct >= Math.floor(TOTAL_Q*0.8) && window.BobcatLesson) BobcatLesson.fireConfetti();
      api.remeasure();
    };

    
    // ── Practical exercises ──
    var PRACTICAL = {"tf": [{"prompt": "Tom says: \"Can you help me?\"", "ans": true}, {"prompt": "Anna says: \"OK. I will call her now.\"", "ans": true}, {"prompt": "The phrase \"Can you help me?\" is only used in formal emails.", "ans": false}], "match": [{"left": "me / you", "right": "me / te"}, {"left": "him / her", "right": "o / a"}, {"left": "us / them", "right": "nos / os"}, {"left": "mine / yours", "right": "meu / seu"}, {"left": "his / hers", "right": "dele / dela"}, {"left": "ours / theirs", "right": "nosso / deles"}], "order": ["Can you help me?", "OK. I will call her now."], "speak": ["Can you help me?", "OK. I will call her now.", "me", "mine", "her"], "scramble": "Can you help me"};
    var tfCorrect = 0, matchCorrect = 0, orderCorrect = 0, speakCorrect = 0, scrambleCorrect = 0;
    var tfTotal = (PRACTICAL.tf||[]).length;
    var matchTotal = (PRACTICAL.match||[]).length;
    var orderTotal = (PRACTICAL.order&&PRACTICAL.order.length>=2) ? 1 : 0;
    var speakTotal = (PRACTICAL.speak||[]).length;
    var scrambleTotal = PRACTICAL.scramble ? 1 : 0;
    var PRACTICAL_TOTAL = tfTotal + matchTotal + orderTotal + speakTotal + scrambleTotal;

    function syncPracticalScore(){
      SCORE.correct = qCorrect + fillCorrect + tfCorrect + matchCorrect + orderCorrect + speakCorrect + scrambleCorrect;
      SCORE.total = TOTAL_Q;
    }
    function showDone(id){
      var el = document.getElementById(id);
      if(el) el.style.display = 'block';
      api.remeasure();
    }

    Gridscape.mountTrueFalse('tfGame', PRACTICAL.tf||[], {
      scoreId: 'tfScore', xp: 10, remeasure: api.remeasure,
      onDone: function(c,t){ tfCorrect=c; syncPracticalScore(); showDone('tfDone'); }
    });
    Gridscape.mountMatch('matchGame', PRACTICAL.match||[], {
      scoreId: 'matchScore', xp: 12, remeasure: api.remeasure,
      onDone: function(c,t){ matchCorrect=c; syncPracticalScore(); showDone('matchDone'); }
    });
    if(orderTotal){
      Gridscape.mountOrder('orderGame', PRACTICAL.order, {
        scoreId: 'orderScore', xp: 20, remeasure: api.remeasure,
        onDone: function(c,t){ orderCorrect=c; syncPracticalScore(); showDone('orderDone'); }
      });
    } else {
      var og = document.getElementById('orderGame');
      if(og) og.innerHTML = '<p class="gpractice-hint">Neste mapa, avance para a prática oral.</p>';
      showDone('orderDone');
    }
    Gridscape.mountSpeakChecklist('speakGame', PRACTICAL.speak||[], {
      scoreId: 'speakScore', xp: 8, remeasure: api.remeasure,
      onDone: function(c,t){ speakCorrect=c; syncPracticalScore(); showDone('speakDone'); }
    });
    if(PRACTICAL.scramble){
      Gridscape.mountScramble('scrambleGame', PRACTICAL.scramble, {
        scoreId: 'scrambleScore', xp: 18, remeasure: api.remeasure,
        onDone: function(c,t){ scrambleCorrect=c; syncPracticalScore(); showDone('scrambleDone'); }
      });
    } else {
      var sg = document.getElementById('scrambleGame');
      if(sg) sg.innerHTML = '<p class="gpractice-hint">Avance para finalizar.</p>';
      showDone('scrambleDone');
    }

    var btnF = document.getElementById('btnFinish');
    if(btnF) btnF.addEventListener('click', async function(){
      SCORE.correct = qCorrect + fillCorrect;
      SCORE.total = TOTAL_Q;
      var msg = document.getElementById('finishMsg');
      if(window.BobcatLesson && typeof BobcatLesson.finishLesson === 'function'){
        var ok = await BobcatLesson.finishLesson(SCORE.correct, SCORE.total, 'correct');
        if(msg){
          msg.style.display = 'block';
          var pct = Math.round((SCORE.correct/SCORE.total)*100);
          msg.style.color = ok ? '#1e6b40' : '#c0392b';
          msg.textContent = ok ? ('🎉 Lição concluída ('+pct+'%)! Progresso salvo.') :
            ('📌 '+SCORE.correct+'/'+SCORE.total+' ('+pct+'%). Precisa de pelo menos 85%.');
        }
      }
    });
  }
});
</script>
</body></html>
