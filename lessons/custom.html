<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carregando lição...</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; background:#fdfaf7; color:#2b2b2b; display:flex;
    align-items:center; justify-content:center; min-height:100vh; margin:0; padding:24px; text-align:center; }
  .box { max-width:420px; }
  .spinner { width:34px; height:34px; border:4px solid #EBC9AE; border-top-color:#D9793F; border-radius:50%;
    margin:0 auto 16px auto; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err { color:#C0392B; font-size:14px; line-height:1.5; }
  a.back { display:inline-block; margin-top:14px; color:#D9793F; font-weight:700; text-decoration:none; font-size:13.5px; }
</style>
</head>
<body>
<div class="box" id="status-box">
  <div class="spinner"></div>
  <div>Carregando lição...</div>
</div>

<script>
// Este arquivo é só um "carregador": lições enviadas pelo professor pelo
// painel (teacher.html) não viram um arquivo de verdade em /lessons/ (o app
// é um site estático, sem servidor para gravar arquivo novo) — em vez disso,
// o HTML enviado fica guardado no banco (tabela custom_lessons) e esta
// página busca e exibe esse conteúdo, substituindo a própria página.
// Como o documento é o mesmo (mesma origem, mesma pasta /lessons/), os
// caminhos relativos usados dentro da lição (ex. "../config.js",
// "../db-client.js", "../index.html") continuam funcionando normalmente.
(async function () {
  function showError(msg) {
    document.getElementById('status-box').innerHTML =
      '<div class="err">⚠️ ' + msg + '</div><a class="back" href="../index.html">← Voltar para o app</a>';
  }

  const params = new URLSearchParams(window.location.search);
  const lessonId = params.get('id');
  if (!lessonId) { showError('Lição não encontrada (link incompleto).'); return; }

  const cfg = window.SUPABASE_CONFIG;
  const configured = cfg && cfg.url && cfg.anonKey && !cfg.url.includes('SEU-PROJETO');
  if (!configured || !window.supabase) {
    showError('Este app precisa do Supabase configurado para abrir lições enviadas pelo professor.');
    return;
  }

  try {
    const client = window.supabase.createClient(cfg.url, cfg.anonKey);
    const { data: { session } } = await client.auth.getSession();
    if (!session) {
      showError('Você precisa estar logado no app para abrir esta lição. <a class="back" href="../index.html">← Voltar e entrar</a>');
      return;
    }

    const { data, error } = await client
      .from('custom_lessons')
      .select('html_content')
      .eq('id', lessonId)
      .maybeSingle();

    if (error) { showError('Não foi possível carregar esta lição (' + error.message + ').'); return; }
    if (!data) { showError('Esta lição não existe mais (pode ter sido removida pelo professor).'); return; }

    // Substitui o documento inteiro pelo HTML da lição — os scripts
    // embutidos nela (LESSON_ID, finishLesson, etc.) rodam normalmente,
    // como se fosse um arquivo .html comum dentro de /lessons/.
    document.open();
    document.write(data.html_content);
    document.close();
  } catch (e) {
    console.error(e);
    showError('Ocorreu um erro inesperado ao carregar a lição.');
  }
})();
</script>
</body>
</html>
